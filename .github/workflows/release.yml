name: Draft release

on:
  push:
    tags:
      # Match every tag; verify:release enforces strict x.y.z tags.
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify release metadata and artifacts
        run: npm run verify:release -- "$GITHUB_REF_NAME"
      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release-files
      - name: Verify downloaded files
        shell: sh
        run: |
          set -eu
          count=$(find release-files -mindepth 1 -maxdepth 1 -print | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "Expected exactly 3 release files; found $count." >&2
            exit 1
          fi
          for file in main.js manifest.json styles.css; do
            if [ ! -f "release-files/$file" ] || [ ! -s "release-files/$file" ]; then
              echo "release-files/$file is missing, not a regular file, or empty." >&2
              exit 1
            fi
          done
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/is-draft 2>/dev/null; then
            if [ "$(< /tmp/is-draft)" != "true" ]; then
              echo "Release $TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release upload "$TAG" release-files/main.js release-files/manifest.json release-files/styles.css --clobber
          else
            gh release create "$TAG" release-files/main.js release-files/manifest.json release-files/styles.css \
              --draft \
              --title "Metronome + Tuner $TAG" \
              --notes "Draft generated by CI. Verify the assets and release notes, then publish this release manually."
          fi
